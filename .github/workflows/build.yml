name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project MIDAS.xcodeproj \
            -scheme MIDAS \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1 || { echo "=== ОШИБКИ КОМПИЛЯЦИИ ==="; grep -E "error:" build.log | sort -u | head -n 40; exit 1; }

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/MIDAS.app Payload/
          zip -qr MIDAS.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: MIDAS-ipa
          path: MIDAS.ipa
